name: CasinoBae Addon Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install factory dependencies
        run: npm ci --ignore-scripts

      - name: Run authoritative offline Lua 5.1 harness
        run: node tests/run-offline-harness.mjs

      - name: Run synthetic LIVE error pipeline
        run: node tests/live_pipeline_synthetic.cjs

      - name: Run runtime regression contracts
        run: node tests/regression-runtime-contract.cjs

      # NOTE : les tests Python du bot de peche sont joues par le job dedie
      # « fishing-python » (matrice ubuntu + windows, avec les dependances
      # numpy/opencv/pywin32 installees). Ils ne sont PAS rejoues ici : ce
      # job n'a pas les dependances Python (cv2) et n'a pas vocation a
      # tester le bot.

      - name: Compile legacy addon sources
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p addon/CasinoBae/*.lua

      - name: Syntax-check website JavaScript
        run: node --check site/app.js

      - name: Run legacy addon harness
        run: lua5.4 tests/casinobae_harness.lua

      - name: Upload factory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casinobae-test-reports
          path: |
            reports/
            logs/

  # Tests Python du bot de peche sur les deux systemes.
  # Le contrat du bot (tests/test_fishing_bot_contract.py) importe fishing_bot,
  # donc pywin32 : il n'est jouable que sur Windows. Les tests portables
  # (detecteur, popup, V2, navigation) passent sur les deux OS.
  fishing-python:
    name: Fishing bot python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python dependencies
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          # PIL (Pillow), mss : capture ; numpy, opencv : vision ;
          # pywin32 : uniquement sous Windows (le bot vise Windows).
          python -m pip install --quiet numpy opencv-python-headless pillow mss
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install --quiet pywin32
          fi

      - name: Run V2 and navigation tests (all OS)
        shell: bash
        run: |
          set -euo pipefail
          # Ces deux modules (memoire des bancs / carte, planificateur,
          # controleur de deplacement) n'utilisent que la bibliotheque
          # standard : ils sont donc jouables partout.
          for t in tests/test_fishing_v2.py \
                   tests/test_fishing_navigator.py \
                   tests/test_fishing_navigation.py \
                   tests/test_fishing_controls.py \
                   tests/test_fishing_skills.py \
                   tests/test_fishing_metrics.py \\
                   tests/test_fishing_actions.py; do
            if [ -f "$t" ]; then
              echo "::group::$t"
              python "$t"
              echo "::endgroup::"
            else
              echo "absent (ignore) : $t"
            fi
          done

      - name: Run detector and popup tests (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Ces tests importent fishing_bot / fishing_observer, qui utilisent
          # ctypes.windll et pywin32 au niveau module : ils ne tournent que
          # sous Windows (le bot est une application Windows).
          for t in tests/test_fishing_detector.py \
                   tests/test_fishing_popup.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

      - name: Run bot contract test (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::tests/test_fishing_bot_contract.py"
          python tests/test_fishing_bot_contract.py
          echo "::endgroup::"

      - name: Explain why the Windows-only tests are skipped on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "detecteur, popup et contrat du bot : ignores hors Windows (ctypes.windll, pywin32)"
