name: CasinoBae Addon Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compile-check every addon Lua file
        run: luac5.4 -p addon/CasinoBae/*.lua
      - name: Syntax-check website JavaScript
        run: node --check site/app.js
      - name: Run offline WoW integration harness
        run: lua5.4 tests/casinobae_harness.lua
