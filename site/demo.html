<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CasinoBae — Demo</title><link rel="stylesheet" href="./styles.css"></head><body><header class="topbar"><a class="brand" href="./">Casino<span>Bae</span></a><a class="button" href="./">Retour</a></header><main><section class="section"><p class="eyebrow">INTERACTIVE DEMO</p><h1>Démo du MVP</h1><p class="lead">Cette démo reproduit uniquement l’interface et le flux d’état. Les résultats WoW réels restent fournis par l’addon.</p><div class="dash-grid"><div class="dash-card"><h3>1. Lobby</h3><button class="button small" onclick="join('DemoPlayer')">Rejoindre</button><div id="players" class="players"></div></div><div class="dash-card"><h3>2. Partie Rand</h3><button class="button small" onclick="roll()">Lancer une démo</button><div id="rolls" class="rolls"></div></div><div class="dash-card wide"><h3>État</h3><div id="state" class="big-state">LOBBY_OPEN</div><p class="muted">Démo locale — aucun événement WoW n’est fabriqué.</p></div></div></section></main><script>let players=[],rolls={};function join(n){if(!players.includes(n))players.push(n);render()}function roll(){if(!players.length)join("DemoPlayer");rolls[players[0]]=Math.floor(Math.random()*100)+1;render()}function render(){document.querySelector("#players").innerHTML=players.map(x=>'<span class="player">'+x+'</span>').join("");document.querySelector("#rolls").innerHTML=Object.entries(rolls).map(([p,v])=>'<div class="roll"><span>'+p+'</span><b>'+v+'</b></div>').join("");document.querySelector("#state").textContent=Object.keys(rolls).length?"ROUND_COMPLETE":"LOBBY_OPEN"}render()</script></body></html>
